[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/redefinir-senha"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
